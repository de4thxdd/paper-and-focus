services:
  - type: web
    name: paper-focus
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: diary-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
